[project]
name = "parliamentrag-mcp"
version = "0.1.0"
description = "MCP server exposing ParliamentRAG: Italian Chamber of Deputies data (search, sittings, roll-call votes, voted texts)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pillow>=10",
]

[project.scripts]
parliamentrag-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "ui_views"]
