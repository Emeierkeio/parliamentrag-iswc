# Multi-View RAG Configuration
# All weights, thresholds, and settings are configurable here.
#
# Secrets (API keys, passwords) live in .env, not here, so this file
# can be committed to version control.

retrieval:
  dense_channel:
    top_k: 200
    # Pool-hygiene floor on the vector-index scale ((1+cos)/2). Calibrated
    # 2026-09-08 on the 15 eval-set topics: the lowest similarity observed
    # among retrieved in-domain chunks is 0.573, so 0.55 drops nothing
    # legitimate. Per-chunk thresholds cannot separate in-domain from
    # out-of-domain queries (the distributions overlap: OOD chunks reach
    # 0.79); that separation is the relevance gate's job below.
    similarity_threshold: 0.55
    index_name: "chunk_embedding_index"

  # Out-of-domain gate (issue #22). Thresholds calibrated with
  # build/calibrate_relevance_gate.py (21/08/2026): the 15 real eval-set
  # topics have at least 15 dense chunks with similarity >= 0.78,
  # out-of-domain queries at most 6.
  relevance_gate:
    enabled: true
    chunk_similarity_floor: 0.78
    min_chunks_above_floor: 10

  graph_channel:
    # Hybrid Eurovoc matching (lexical + semantic)
    lexical_keywords_min_match: 1
    semantic_similarity_threshold: 0.4
    max_acts_per_query: 100
    # Post-traversal chunk-level filter: discard chunks whose embedding
    # similarity to the query is below this threshold. Prevents off-topic
    # chunks from being included just because their speaker co-signed a
    # relevant parliamentary act. Same normalized (1+cos)/2 scale as the
    # dense channel; 0.65 equals the previous raw-cosine 0.30 boundary,
    # which the selected-chunk distribution starts at (p1 = 0.30 raw,
    # measured 2026-09-08 on the eval-set topics).
    chunk_similarity_threshold: 0.65
    # Signatory chunks: fetched wide (deterministic id order), then ranked by
    # query similarity in Python and capped, so the cap keeps the most
    # relevant candidates (issue #24).
    signatory_candidate_limit: 500
    signatory_chunk_cap: 200

  merger:
    # authority_weight is minimal because authority is computed post-retrieval
    # (the merger runs before AuthorityScorer). Real authority ranking happens
    # in pipeline.py _group_evidence_by_party (speaker-first interleaving).
    # The freed weight is redistributed to relevance and salience.
    diversity_weight: 0.15     # Penalize same-speaker dominance
    coverage_weight: 0.20      # Reward party coverage
    authority_weight: 0.05     # Token value — scorer not yet available at merge time
    relevance_weight: 0.35     # Primary signal: embedding similarity to query
    salience_weight: 0.25      # Prefer politically substantive chunks over procedural text

authority:
  weights:
    # Semantic signals (topic-specific, highest quality):
    profession: 0.15   # Cosine sim query ↔ profession embedding
    education: 0.10    # Cosine sim query ↔ education embedding
    committee: 0.25    # Cosine sim query ↔ committee embedding
    # Activity signals (count-based, not topic-filtered):
    acts: 0.20         # Weighted act count (time-decayed)
    interventions: 0.25 # Weighted speech count (time-decayed)
    # Structural signal:
    role: 0.05         # Institutional role (president/VP/secretary)

  time_decay:
    # Acts represent durable legislative commitment — longer half-life
    acts_half_life_days: 548      # 18 months
    speeches_half_life_days: 548  # 18 months

  # Minimum cosine similarity between act description_embedding and the query
  # embedding for an act to be counted. Acts below this threshold are off-topic
  # and do not contribute to the authority score.
  # text-embedding-3-small typical range for related content: 0.25–0.60
  acts_relevance_threshold: 0.25

  # Minimum cosine similarity between speech text_embedding and the query
  # embedding for a speech to be counted (same text-embedding-3-small scale
  # as acts_relevance_threshold above).
  # Speech embeddings are computed by build/precalculate_embeddings.py Phase 5
  # (first 2000 chars of preprocessed speech text).
  interventions_relevance_threshold: 0.25

  # Cap individual component contributions
  max_component_contribution: 0.8

# Soft ideological anchors - fully configurable.
# These are guidelines for multi-view coverage, not hard classifications.
compass:
  purpose: "multi-view coverage"  # coverage aid, not ideology discovery

  # Axis discovery: "semantic" (default) anchors the axes to two LLM-generated
  # pole pairs for the query (readable by construction, stable across time
  # windows — required for the future position-timeline feature); "pca" is the
  # legacy post-hoc discovery. Semantic falls back to PCA on any LLM failure.
  axis_method: "semantic"
  semantic_axes:
    model: "gpt-5.6-luna"   # pole generation (temperature 0, JSON mode)
    max_axis_cos: 0.85      # above this the two axes are near-duplicates -> warning

  # LLM stance scoring: positions come from what each speaker argues, scored
  # per axis in [-1,1] (null = no position), instead of embedding projection
  # (which tracks vocabulary, not stance). Falls back to embedding projection
  # on any failure.
  stance:
    enabled: true
    model: "gpt-5.6-luna"   # temperature 0, JSON mode, batched
    batch_size: 25          # fragments per LLM call
    max_workers: 8          # parallel batch calls (25*8 = one wave for 200 fragments)
    max_fragments: 200      # classify at most this many (retrieval order)
    text_clip: 700          # chars of each fragment sent to the classifier
    # Group position shrinkage: per-axis mean is multiplied by n/(n+k), so a
    # position resting on few stance-taking fragments slides toward the
    # neutral center instead of sitting at the extremes.
    position_shrinkage_k: 3

  anchors:
    enabled: false  # Set to true to enable soft anchors for axis orientation
    left:
      groups:
        - "Alleanza Verdi e Sinistra"
        - "Partito Democratico - Italia Democratica e Progressista"
      confidence: 0.8

    center:
      groups:
        - "Azione - Popolari Europeisti Riformatori - Renew Europe"
        - "Italia Viva - Casa Riformista"
        - "Noi Moderati (Noi con l'Italia, Coraggio Italia, UDC e Italia al Centro) - MAIE - Centro Popolare"
      confidence: 0.6

    right:
      groups:
        - "Fratelli d'Italia"
        - "Lega - Salvini Premier"
        - "Forza Italia - Berlusconi Presidente - PPE"
      confidence: 0.8

  # Ambiguous groups - position configurable based on research needs
  ambiguous:
    "Movimento 5 Stelle":
      default_position: "left"
      confidence: 0.5
      note: "Position contested - configurable"

  # Groups without default ideological position
  unclassified:
    - "Misto"

  clustering:
    min_fragments_for_kde: 3
    kde_bandwidth: "scott"  # or numeric value

  # Weighted PCA parameters (IC-1)
  max_weight_per_fragment: 0.05  # Clip max weight to prevent single-group dominance

  # Dimensionality decision (IC-1)
  pc2_pc1_ratio_threshold: 0.40  # If PC2/PC1 < 0.40, use 1D mode
  min_variance_explained: 0.05   # Refuse analysis if total variance < 5%

  # Projection parameters (IC-2)
  z_score_clip_threshold: 4.0    # Soft clip Z-scores beyond ±4σ
  scr_confidence_threshold: 0.15 # Filter fragments with SCR < 0.15

  # Axis labeling parameters (IC-6)
  tfidf_top_terms: 3             # Number of top TF-IDF terms for label
  pole_purity_threshold: 0.30    # Minimum pole coherence

  # Visualization parameters
  scatter_sample_size: 200       # Max points in scatter plot
  scatter_random_seed: 42        # Fixed seed for reproducibility

generation:
  # OpenAI models for the 4-stage pipeline
  models:
    analyst: "gpt-4.1-mini"  # Stage 1: Claim decomposition (structured extraction — mini is enough)
    writer: "gpt-4.1"        # Stage 2: Sectional writing (verbatim citations — needs top instruction following)
    integrator: "gpt-4.1"    # Stage 3: Narrative integration (long rewrite preserving {CIT:N} markers)
    # Quote selection, not writing: bad picks are dropped by the downstream
    # substring verification, so a small model fails safe. gpt-4.1-mini was
    # rejected 2026-07-23 (anaphoric picks); gpt-4o held until it left the
    # OpenAI lineup; gpt-5.6-luna under trial since 2026-09-19.
    quote_picker: "gpt-5.6-luna"
    # Stage 4 (Citation Surgeon) is deterministic, no LLM needed.
    # Synthesis (Stage 3.5) was removed from the pipeline. EvidenceFirstWriter
    # is still used by pipeline.py as the citation-repair fallback for
    # sections whose quotes fail verification.

  # Sampling parameters are intentionally NOT configurable: each stage sets
  # its own tuned temperature/max_tokens in code (analyst 0.1/2000,
  # sectional 0.1/800, integrator 0.0/5000), chosen for reproducible
  # verbatim citations.

  # Stage 3 integration mode:
  # - "assembler": sections are assembled deterministically into coalition
  #   blocks; the LLM writes only the introduction (which carries no citation
  #   markers). Citations/attributions preserved by construction.
  # - "llm": legacy full-document rewrite with citation guard and retry.
  integrator_mode: "assembler"

  # Position brief: provides group-level context to the sectional writer
  # so citations are selected consistently with the group's overall stance
  position_brief:
    enabled: true
    max_chunks: 5          # Top N chunks to include in brief
    chars_per_chunk: 400   # Max chars per chunk in the brief
    context_chars: 500     # Context chars shown per evidence item

  no_evidence_message: "Nel corpus analizzato non risultano interventi rilevanti su questo tema."

# Coalition definitions for temporal authority logic.
# Coalition crossing (maggioranza <-> opposizione) invalidates prior authority.
coalitions:
  maggioranza:
    - "Fratelli d'Italia"
    - "Lega - Salvini Premier"
    - "Forza Italia - Berlusconi Presidente - PPE"
    - "Noi Moderati (Noi con l'Italia, Coraggio Italia, UDC e Italia al Centro) - MAIE - Centro Popolare"

  opposizione:
    - "Partito Democratico - Italia Democratica e Progressista"
    - "Movimento 5 Stelle"
    - "Alleanza Verdi e Sinistra"
    - "Azione - Popolari Europeisti Riformatori - Renew Europe"
    - "Italia Viva - Casa Riformista"
    # Senate only. On the confidence votes of the XIX its senators voted 132
    # times against, 66 abstained (mostly SVP) and 9 in favour (staging, 2026-10-11).
    - "Per le Autonomie (SVP-PATT, Campobase)"

  # The Gruppo Misto cannot be assigned to either side: it contains political
  # components of opposing orientation (+Europa vs Futuro Nazionale Vannacci).
  # It gets its own section in the summary and is excluded from the binary balance.
  misto:
    - "Misto"

# Chambers whose sittings the graph holds. A group that exists in one chamber
# only is expected in answers ("tutti i gruppi") only when that chamber is
# loaded; add "senato" when the Senate reaches production.
chambers: ["camera"]
chamber_only_groups:
  "Per le Autonomie (SVP-PATT, Campobase)": "senato"

# Scopes whose speech text and chunk embeddings live in the Postgres archive
# (decision 2026-10-12; tables in build/pg_archive.py) instead of Neo4j.
# Active only with ARCHIVE_URL set; ARCHIVE_SCOPES="senato_19" overrides this.
archive:
  scopes: []

# Citation extraction settings
citation:
  # Display format only. The verbatim-substring verification is a pipeline
  # invariant, not an option: every published quote is re-extracted from the
  # source speech and must match exactly.
  format: "«{quote}» [{speaker}, {party}, {date}, ID:{id}]"
  # Semantic dedup threshold (cosine similarity, MMR-inspired)
  # Citations with similarity > threshold are considered duplicates
  dedup_similarity_threshold: 0.85

  # Citation integrity system settings
  integrity:
    # Minimum semantic coherence score (0.0-1.0)
    # For embedding method: 0.22 calibrated for gpt-4.1 writer style — its framing
    # sentences are more abstract/concise than gpt-4o's, so legitimate citations
    # score 0.23-0.30 (with 0.30 they were mass-removed). Real mismatches score <=0.20.
    # For jaccard method: 0.2 recommended (keyword overlap)
    min_coherence_score: 0.22
    # Coherence validation method: "embedding" (primary) or "jaccard" (fallback)
    coherence_method: "embedding"

# Query rewriting: expand short/ambiguous queries before retrieval
query_rewriting:
  enabled: true
  # nano does not know niche political terms: it expanded "remigrazione"
  # as bird migration and "ius scholae" as right to education, poisoning
  # the retrieval embeddings and keywords (2026-07-24). gpt-5.6-luna under
  # trial since 2026-09-19: newer generation, to be re-checked on the same
  # niche terms before promoting.
  model: "gpt-5.6-luna"
  # Only rewrite queries with at most this many words.
  # Longer queries are already descriptive enough.
  max_query_words: 5

# LLM provider configuration
llm:
  # Embedding model
  embedding_model: "text-embedding-3-small"
